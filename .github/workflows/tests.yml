name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

env:
  CASK: authfailed/octobrowser/octo-browser

jobs:
  test:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew test-bot --only-tap-syntax

      - run: brew audit --cask --strict --online "$CASK"

      - run: brew fetch --cask --force --arch=intel "$CASK"

      - run: brew install --cask "$CASK"

      - run: test -d "/Applications/Octo Browser.app"

      - run: brew uninstall --zap --cask "$CASK"
